name: Deploy to Dev

# develop 브랜치 push 시 자동 배포 + 수동 실행 가능
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 테스트까지 함께 돌므로 빌드 단계가 3분대다. 매달리는 것을 막을 상한만 둔다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 테스트와 jar 생성을 한 번에 돌린다(`build` 가 test + bootJar 를 포함).
      #
      # 테스트를 여기서 도는 이유: ci.yml 을 따로 두면 두 워크플로가 서로를 몰라서
      # 테스트가 깨져도 배포는 그대로 나간다. 한 잡으로 묶어야 실패가 배포를 실제로 막는다.
      # Testcontainers(MySQL)는 GitHub 호스티드 러너의 Docker 로 그대로 뜬다.
      - name: Test and build
        run: ./gradlew clean build --no-daemon

      # 배포가 막힌 이유를 보려면 리포트가 필요하다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          # BlueRack 은 SSH 가 22 가 아니라 접속 게이트웨이의 전용 포트로 들어온다(없으면 22).
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: build/libs/*-SNAPSHOT.jar
          target: /tmp/billage
          strip_components: 2

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          # BlueRack 은 SSH 가 22 가 아니라 접속 게이트웨이의 전용 포트로 들어온다(없으면 22).
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GMAIL_USERNAME,GMAIL_APP_PASSWORD
          script: |
            set -e
            # 0) 메일(Gmail SMTP) 계정을 서버 환경 파일에 넣는다. 값은 GitHub Secret 에만 두고 저장소에는 없다.
            #    Secret 이 비어 있으면 서버에 이미 있는 값을 그대로 쓴다.
            #
            #    jar 와 환경 파일은 짝이다 — 이전 jar 는 바뀐 값(SMTP)을 읽지 못하고, 새 jar 는 옛 값(SES)을 읽지 못한다.
            #    그래서 시작할 때 둘 다 사본을 남기고, 성공으로 끝나지 않으면 어디서 멈추든 둘을 함께 되돌린다.
            ENV_FILE=/etc/billage/billage.env
            JAR=/opt/billage/billage.jar
            sudo cp -p "$ENV_FILE" "$ENV_FILE.prev"
            DONE=0; SWAPPED=0
            # 반환값: 0 = 둘 다 되돌림, 2 = 되돌릴 jar 가 없음(첫 배포), 1 = 되돌리다 실패.
            # jar 를 못 되돌리면 환경 파일도 건드리지 않는다 — 새 jar 에 옛 환경 파일이 붙으면 그것도 뜨지 못한다.
            restore_pair() {
              if [ "$SWAPPED" = 1 ]; then
                [ -f "$JAR.prev" ] || return 2
                sudo mv "$JAR.prev" "$JAR" || return 1
                SWAPPED=0
              fi
              sudo cp -p "$ENV_FILE.prev" "$ENV_FILE" || return 1
            }
            # 헬스 체크 실패는 아래 3)에서 직접 되돌린다. 여기는 그 밖의 중단(명령 실패 등)을 받는다.
            trap 'if [ "$DONE" != 1 ]; then
                    echo "⚠️ 배포 중단 — jar 와 환경 파일을 되돌림"
                    if restore_pair && sudo systemctl restart billage; then echo "↩️ 되돌림 완료"
                    else echo "🔥 되돌리기 실패 — 서버에서 jar 와 환경 파일을 직접 확인해야 함"; fi
                  fi' EXIT
            set_env() {
              sudo sed -i -e "/^$1=/d" -e '$a\' "$ENV_FILE"
              printf '%s=%s\n' "$1" "$2" | sudo tee -a "$ENV_FILE" > /dev/null
            }
            if [ -n "$GMAIL_USERNAME" ] && [ -n "$GMAIL_APP_PASSWORD" ]; then
              set_env GMAIL_USERNAME "$GMAIL_USERNAME"
              # 구글이 네 글자씩 띄워 보여 주는 공백을 뺀다.
              set_env GMAIL_APP_PASSWORD "$(printf '%s' "$GMAIL_APP_PASSWORD" | tr -d ' ')"
            elif ! sudo grep -q '^BILLAGE_MAIL_SENDER=LOG$' "$ENV_FILE" \
                && ! { sudo grep -q '^GMAIL_USERNAME=..*' "$ENV_FILE" && sudo grep -q '^GMAIL_APP_PASSWORD=..*' "$ENV_FILE"; }; then
              # 계정 없이 새 jar 를 올리면 기동이 실패한다 — jar 를 바꾸기 전에 멈춘다.
              echo "❌ GMAIL_USERNAME / GMAIL_APP_PASSWORD 가 Secret 에도 서버에도 없습니다. Secret 을 등록한 뒤 다시 배포하세요."
              exit 1
            fi
            # SES 시절 값이 남아 있으면 새 jar 가 설정을 읽지 못해 기동이 실패한다.
            # 발신 주소도 SES 때 값이 남아 있으면 Gmail 계정이 아닌 주소로 보내려 하므로 지운다.
            sudo sed -i -e 's/^BILLAGE_MAIL_SENDER=SES$/BILLAGE_MAIL_SENDER=SMTP/' -e '/^BILLAGE_MAIL_FROM=/d' "$ENV_FILE"

            # 1) 현재 jar 를 롤백용으로 보관 후 새 jar 배치
            if [ -f "$JAR" ]; then
              sudo cp "$JAR" "$JAR.prev"
            else
              sudo rm -f "$JAR.prev"
            fi
            SWAPPED=1
            sudo mv /tmp/billage/*.jar "$JAR"
            sudo systemctl restart billage

            # 헬스 폴링 함수: 전체 40초 데드라인(벽시계) 기준. 각 curl 도 타임아웃으로 무한대기 방지.
            #    2xx/3xx = 성공(현재 전 엔드포인트 permitAll 이라 200), 000(무응답)·5xx = 실패.
            wait_health() {
              local deadline=$(( $(date +%s) + 40 ))
              while [ "$(date +%s)" -lt "$deadline" ]; do
                code=$(curl -s -o /dev/null -w '%{http_code}' \
                  --connect-timeout 3 --max-time 5 \
                  http://127.0.0.1:8080/actuator/health || true)
                case "$code" in 2*|3*) return 0 ;; esac
                [ "$(date +%s)" -lt "$deadline" ] && sleep 2
              done
              return 1
            }

            # 2) 새 jar 기동 확인
            if wait_health; then
              echo "✅ billage up (HTTP $code)"; DONE=1; exit 0
            fi

            # 3) 실패 시 이전 jar 로 롤백 + 롤백본도 헬스 재확인
            echo "❌ health check 실패 (last HTTP='$code') — 이전 jar 로 롤백"
            rc=0; restore_pair || rc=$?
            if [ "$rc" = 0 ]; then
              if sudo systemctl restart billage && wait_health; then
                echo "↩️ 이전 jar 로 롤백 완료 (HTTP $code)"
              else
                echo "🔥 롤백 후에도 비정상 (last HTTP='$code') — 수동 확인 필요"
              fi
            elif [ "$rc" = 2 ]; then
              echo "⚠️ 롤백할 이전 jar 없음"
            else
              echo "🔥 되돌리기 실패 — 서버에서 jar 와 환경 파일을 직접 확인해야 함"
            fi
            sudo journalctl -u billage -n 50 --no-pager
            # 위에서 이미 되돌렸다 — 종료 처리에서 다시 손대지 않게 한다.
            DONE=1
            exit 1
