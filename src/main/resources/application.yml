server:
  # HTTPS 리버스 프록시(Caddy) 뒤에서 X-Forwarded-* 헤더를 존중 → Swagger/링크가 https·정상 호스트로 생성
  forward-headers-strategy: framework

spring:
  application:
    name: billage-server
  servlet:
    multipart:
      # 개별 파일 상한은 billage.file.max-size 로 검증해 FILE_SIZE_EXCEEDED 로 응답한다.
      # 여기 값은 컨테이너 차원의 방어선이라 조금 넉넉하게 둔다.
      max-file-size: 12MB
      max-request-size: 24MB
  profiles:
    default: local
  datasource:
    hikari:
      # MySQL 은 jakarta.persistence.lock.timeout 힌트를 무시하므로 세션 수준에서 락 대기 시간을 제한한다.
      # 비관적 락(재발급/로그아웃) 경합 시 기본 50초 동안 스레드를 점유해 풀이 고갈되는 것을 방지.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  jackson:
    deserialization:
      # Optional 필드에서 "미전달"과 "JSON null"을 구분하기 위해 필요하다.
      # 끄면 Jackson 3 기본값상 미전달도 Optional.empty() 로 바인딩되어,
      # 폴더 수정에서 이름만 보내도 상위 폴더가 최상위로 이동해버린다(FolderUpdateRequest).
      use-null-for-missing-reference-values: true

billage:
  mail:
    # LOG(로그로만 남김) | SES. 로컬·테스트는 LOG, dev·prod 는 SES.
    sender: ${BILLAGE_MAIL_SENDER:LOG}
    # SES 에서 검증된 발신 주소. 도메인 검증 전에는 개별 주소를 검증해 쓴다.
    from: ${BILLAGE_MAIL_FROM:no-reply@billage.app}
  auth:
    email-verification:
      # 화면 타이머(03:00)와 같은 값이어야 한다.
      ttl-seconds: 180
      max-attempts: 5
      max-sends: 5
      send-window-minutes: 60
      # 프론트가 인증 화면을 붙이면 true 로 바꾼다. 그전까지 켜면 기존 가입 흐름이 막힌다.
      required-for-signup: ${BILLAGE_EMAIL_VERIFICATION_REQUIRED:false}
    terms:
      # 가입 요청에 agreements 를 요구할지. 프론트가 약관 동의 화면을 붙이면 true 로 바꾼다.
      # 값이 들어오면 이 설정과 무관하게 항상 필수 3종을 검증한다.
      required-for-signup: ${BILLAGE_TERMS_REQUIRED:false}
  file:
    # LOCAL(서버 디스크) | S3. 로컬 개발은 LOCAL, dev·prod 는 S3.
    storage: ${BILLAGE_FILE_STORAGE:LOCAL}
    storage-path: ${FILE_STORAGE_PATH:./data/files}
    max-size: 10MB
    # 응답 파일 URL 의 절대 주소. 비우면 요청(X-Forwarded-* 반영)에서 유추한다.
    public-base-url: ${BILLAGE_PUBLIC_BASE_URL:}
    s3:
      bucket: ${BILLAGE_FILE_S3_BUCKET:}
      # 한 버킷을 dev·prod 가 공유하므로 환경 프리픽스로 구분한다.
      prefix: ${BILLAGE_FILE_S3_PREFIX:dev}
      presign-expiry: 5m
  ocr:
    # STUB(고정값 반환) | CLOVA_RECEIPT(영수증 모델) | CLOVA_GENERAL(범용 모델, 임시).
    # 로컬·테스트는 STUB. STUB 은 로컬·테스트 프로필에서만 뜬다 — 배포 환경에서 켜면 기동이 실패한다
    # (가짜 금액이 장부에 올라가는 것을 막는다).
    provider: ${BILLAGE_OCR_PROVIDER:STUB}
    # 클로바 OCR 도메인의 APIGW Invoke URL. 주소 끝이 곧 모델이라 provider 와 짝이 맞아야 한다
    # (CLOVA_RECEIPT -> .../document/receipt, CLOVA_GENERAL -> .../general).
    invoke-url: ${BILLAGE_OCR_INVOKE_URL:}
    # 도메인 발급 시크릿. X-OCR-SECRET 헤더로 보낸다. 커밋 금지 — 환경변수로만 주입한다.
    secret-key: ${BILLAGE_OCR_SECRET_KEY:}
    # 업로드 상한(10MB)보다 작다. 이미지를 Base64 로 본문에 싣느라 원본의 1.4배가 메모리에 올라간다.
    max-image-size: 4MB
    connect-timeout: 3s
    read-timeout: 10s
    # 사용자당 시간당 인식 횟수. 외부 OCR 은 건당 과금이라 상한 없이 열어 두지 않는다.
    max-scans-per-hour: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  issuer: billage-api
  audience: billage-app
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:30m}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:14d}

oauth:
  google:
    # 구글 ID Token의 aud 클레임 검증용. RN 앱이 Google Sign-In에서 발급받는 서버(Web) 클라이언트 ID.
    # 미설정 시 빈 값 → 구글 로그인은 항상 SOCIAL_TOKEN_INVALID (다른 기능 기동을 막지 않기 위함).
    client-id: ${GOOGLE_CLIENT_ID:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3307/billage?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    username: billage
    password: billage

# 로컬 개발 전용 기본 비밀키(운영에서는 반드시 JWT_SECRET 환경변수로 주입). HS256 → 최소 32바이트.
jwt:
  secret: ${JWT_SECRET:local-dev-only-billage-jwt-secret-please-change-32bytes+}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# dev(배포) 서버에서 Swagger 노출 — 배포 서버 API 확인·테스트용
billage:
  mail:
    # 이 환경의 기본은 SES 다. 환경변수를 빠뜨렸다고 조용히 발송이 멈추면 안 된다.
    sender: ${BILLAGE_MAIL_SENDER:SES}
    # SES 에서 검증된 발신 주소. 도메인 검증 전에는 개별 주소를 검증해 쓴다.
    from: ${BILLAGE_MAIL_FROM:no-reply@billage.app}
  auth:
    email-verification:
      # 화면 타이머(03:00)와 같은 값이어야 한다.
      ttl-seconds: 180
      max-attempts: 5
      max-sends: 5
      send-window-minutes: 60
      # 프론트가 인증 화면을 붙이면 true 로 바꾼다. 그전까지 켜면 기존 가입 흐름이 막힌다.
      required-for-signup: ${BILLAGE_EMAIL_VERIFICATION_REQUIRED:false}
    terms:
      # 가입 요청에 agreements 를 요구할지. 프론트가 약관 동의 화면을 붙이면 true 로 바꾼다.
      # 값이 들어오면 이 설정과 무관하게 항상 필수 3종을 검증한다.
      required-for-signup: ${BILLAGE_TERMS_REQUIRED:false}
  file:
    # LOCAL(서버 디스크) | S3. 로컬 개발은 LOCAL, dev·prod 는 S3.
    storage: ${BILLAGE_FILE_STORAGE:LOCAL}
    storage-path: ${FILE_STORAGE_PATH:./data/files}
    max-size: 10MB
    # 응답 파일 URL 의 절대 주소. 비우면 요청(X-Forwarded-* 반영)에서 유추한다.
    public-base-url: ${BILLAGE_PUBLIC_BASE_URL:}
    s3:
      bucket: ${BILLAGE_FILE_S3_BUCKET:}
      # 한 버킷을 dev·prod 가 공유하므로 환경 프리픽스로 구분한다.
      prefix: ${BILLAGE_FILE_S3_PREFIX:dev}
      presign-expiry: 5m
  ocr:
    # STUB(고정값 반환) | CLOVA_RECEIPT(영수증 모델) | CLOVA_GENERAL(범용 모델, 임시).
    # 기본값은 명세대로 CLOVA_RECEIPT 다. 범용 모델은 총액·결제일이 추론값이고 품목이 비어 있어
    # 명세를 온전히 만족하지 못하므로, 쓰려면 BILLAGE_OCR_PROVIDER=CLOVA_GENERAL 로 명시해야 한다 —
    # 기본값으로 두면 영수증 도메인이 승인된 뒤에도 아무도 모르게 범용으로 계속 돌 수 있다.
    provider: ${BILLAGE_OCR_PROVIDER:CLOVA_RECEIPT}
    # 클로바 OCR 도메인의 APIGW Invoke URL. 주소 끝이 곧 모델이라 provider 와 짝이 맞아야 한다
    # (CLOVA_RECEIPT -> .../document/receipt, CLOVA_GENERAL -> .../general).
    invoke-url: ${BILLAGE_OCR_INVOKE_URL:}
    # 도메인 발급 시크릿. X-OCR-SECRET 헤더로 보낸다. 커밋 금지 — 환경변수로만 주입한다.
    secret-key: ${BILLAGE_OCR_SECRET_KEY:}
    # 업로드 상한(10MB)보다 작다. 이미지를 Base64 로 본문에 싣느라 원본의 1.4배가 메모리에 올라간다.
    max-image-size: 4MB
    connect-timeout: 3s
    read-timeout: 10s
    # 사용자당 시간당 인식 횟수. 외부 OCR 은 건당 과금이라 상한 없이 열어 두지 않는다.
    max-scans-per-hour: 60

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

