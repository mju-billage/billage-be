# 서버(EC2)용 MySQL. 로컬 개발용 루트의 compose.yaml 와는 별개.
# 포트를 127.0.0.1 로만 바인딩해 외부에 절대 노출하지 않는다.
# 사용: cd /opt/billage && sudo docker compose --env-file /etc/billage/mysql.env up -d

services:
  mysql:
    image: mysql:8.4
    container_name: billage-mysql
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: billage
      MYSQL_USER: billage
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in /etc/billage/mysql.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in /etc/billage/mysql.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 1GB RAM 환경이라 버퍼풀을 작게 잡는다.
      - --innodb-buffer-pool-size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
